<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALK BATTLE ROULETTE - トークテーマ・ルーレット</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans JP & Bebas Neue -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
            overflow-x: hidden;
        }
        .font-bebas {
            font-family: 'Bebas Neue', cursive;
        }
        /* ネオン・スポットライト風背景 */
        .bg-stage {
            background: radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.25) 0%, rgba(9, 9, 11, 1) 70%);
        }
        /* ドラムロール・ルーレットの枠 */
        .roulette-frame {
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #dc2626;
        }
        /* 決定時のフラッシュアニメーション */
        @keyframes flashRed {
            0% { box-shadow: 0 0 60px rgba(239, 68, 68, 0.9), inset 0 0 40px rgba(239, 68, 68, 0.6); border-color: #f87171; }
            100% { box-shadow: 0 0 30px rgba(220, 38, 38, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8); border-color: #dc2626; }
        }
        .animate-flash {
            animation: flashRed 0.8s ease-out;
        }
        /* ボタンの立体感とホバーエフェクト */
        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 #991b1b, 0 10px 20px rgba(0,0,0,0.5);
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #991b1b, 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-stop {
            box-shadow: 0 6px 0 #b45309, 0 10px 20px rgba(0,0,0,0.5);
        }
        .btn-stop:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b45309, 0 4px 10px rgba(0,0,0,0.5);
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }
    </style>
</head>
<body class="bg-stage min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- ヘッダー -->
    <header class="w-full py-4 px-4 sm:px-8 border-b border-zinc-800/80 backdrop-blur-md sticky top-0 z-30 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="bg-red-600 text-white text-xs font-black px-2 py-1 rounded tracking-widest uppercase">LIVE</span>
            <h1 class="font-bebas text-2xl sm:text-3xl tracking-wider text-white">
                TALK <span class="text-red-500">BATTLE</span> ROULETTE
            </h1>
        </div>
        <div class="flex items-center gap-2 sm:gap-4">
            <!-- サウンドON/OFFトグル -->
            <button id="soundToggleBtn" class="p-2 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 transition flex items-center gap-1.5 text-xs sm:text-sm border border-zinc-700" title="効果音の切り替え">
                <svg id="soundOnIcon" class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <svg id="soundOffIcon" class="w-4 h-4 text-zinc-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                <span class="hidden sm:inline" id="soundStatusText">SE: ON</span>
            </button>
            <!-- テーマ管理モーダルボタン -->
            <button id="openThemesBtn" class="p-2 px-3 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-200 transition flex items-center gap-1.5 text-xs sm:text-sm border border-zinc-700">
                <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                <span>テーマ設定 (<span id="themeCountBadge">0</span>)</span>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-6 sm:py-10 w-full max-w-4xl mx-auto">
        
        <!-- ステータス表示バッジ -->
        <div id="statusBadge" class="mb-4 px-4 py-1.5 rounded-full bg-zinc-900 border border-zinc-700 text-xs sm:text-sm font-bold tracking-widest text-zinc-400 flex items-center gap-2">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-zinc-500"></span>
            <span id="statusText">READY TO SURVIVE</span>
        </div>

        <!-- ルーレット表示エリア -->
        <div id="rouletteBox" class="roulette-frame w-full bg-zinc-950/90 rounded-2xl p-6 sm:p-12 min-h-[240px] sm:min-h-[300px] flex flex-col items-center justify-center text-center relative overflow-hidden transition-all">
            <!-- 装飾用コーナーライン -->
            <div class="absolute top-3 left-3 w-4 h-4 border-t-2 border-l-2 border-red-500/60"></div>
            <div class="absolute top-3 right-3 w-4 h-4 border-t-2 border-r-2 border-red-500/60"></div>
            <div class="absolute bottom-3 left-3 w-4 h-4 border-b-2 border-l-2 border-red-500/60"></div>
            <div class="absolute bottom-3 right-3 w-4 h-4 border-b-2 border-r-2 border-red-500/60"></div>

            <!-- カテゴリーラベル -->
            <div id="themeCategory" class="text-xs sm:text-sm font-bold tracking-widest text-red-500 uppercase mb-3 opacity-80">
                THEME
            </div>

            <!-- メインテーマテキスト -->
            <h2 id="themeDisplay" class="text-2xl sm:text-4xl md:text-5xl font-black text-white leading-tight tracking-tight break-words max-w-2xl">
                スタートボタンを押して<br>テーマを決めろ！
            </h2>

            <!-- サブヒント・煽り文句 -->
            <p id="themeSubtext" class="mt-4 text-xs sm:text-sm text-zinc-400 max-w-lg">
                面白くなければ即脱落！？ 己のエピソードトークで生き残れ！
            </p>
        </div>

        <!-- コントロールボタンエリア -->
        <div class="mt-8 w-full max-w-md flex flex-col items-center gap-4">
            <!-- メインのスタート/ストップボタン -->
            <button id="mainActionBtn" class="btn-action w-full py-4 sm:py-5 px-8 rounded-xl bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 text-white font-black text-xl sm:text-2xl tracking-wider uppercase cursor-pointer select-none flex items-center justify-center gap-3">
                <svg id="playIcon" class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                <svg id="stopIcon" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg>
                <span id="mainBtnText">ルーレットを回す</span>
            </button>

            <!-- サブオプション：重複除外チェック -->
            <label class="flex items-center gap-2 text-xs sm:text-sm text-zinc-400 cursor-pointer hover:text-zinc-200 transition">
                <input type="checkbox" id="excludeUsedCheckbox" checked class="rounded bg-zinc-800 border-zinc-600 text-red-600 focus:ring-red-500 w-4 h-4">
                <span>一度出たテーマは除外する（残り <span id="remainingCount" class="font-bold text-white">0</span> テーマ）</span>
            </label>
        </div>

        <!-- トーク用タイマーセクション（テーマ決定後に活躍） -->
        <div id="timerSection" class="mt-8 w-full max-w-lg bg-zinc-900/80 border border-zinc-800 rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-zinc-800 rounded-lg text-red-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <div class="text-xs text-zinc-400 font-bold">TALK TIMER</div>
                    <div id="timerDisplay" class="font-bebas text-3xl sm:text-4xl tracking-wider text-white">01:00</div>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <select id="timerPreset" class="bg-zinc-800 border border-zinc-700 text-zinc-200 text-xs sm:text-sm rounded-lg px-2.5 py-2 focus:outline-none focus:border-red-500">
                    <option value="30">30秒</option>
                    <option value="60" selected>1分</option>
                    <option value="90">1分30秒</option>
                    <option value="120">2分</option>
                    <option value="180">3分</option>
                </select>
                <button id="timerToggleBtn" class="px-4 py-2 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-white text-xs sm:text-sm font-bold transition">
                    スタート
                </button>
                <button id="timerResetBtn" class="px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs sm:text-sm transition" title="リセット">
                    ↺
                </button>
            </div>
        </div>

        <!-- 履歴セクション -->
        <div id="historySection" class="mt-8 w-full max-w-2xl hidden">
            <div class="flex justify-between items-center mb-2 px-1">
                <h3 class="text-xs font-bold tracking-wider text-zinc-400 uppercase">出題済みテーマ履歴</h3>
                <button id="resetHistoryBtn" class="text-xs text-red-400 hover:text-red-300 underline">履歴をリセット</button>
            </div>
            <div id="historyList" class="flex flex-wrap gap-2">
                <!-- 履歴タグがここに追加される -->
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="w-full py-4 text-center text-xs text-zinc-600 border-t border-zinc-900">
        TALK BATTLE ROULETTE — 飲み会・パーティー・配信のトークネタに！
    </footer>

    <!-- テーマ管理モーダル -->
    <div id="themesModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
            <!-- モーダルヘッダー -->
            <div class="p-5 border-b border-zinc-800 flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-bold text-white">トークテーマの編集・追加</h3>
                    <p class="text-xs text-zinc-400">番組風の王道テーマから、自分たちだけのオリジナルテーマまで追加できます。</p>
                </div>
                <button id="closeThemesBtn" class="text-zinc-400 hover:text-white p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- 新規テーマ追加フォーム -->
            <div class="p-4 bg-zinc-950/50 border-b border-zinc-800 flex flex-col sm:flex-row gap-2">
                <select id="newThemeCategory" class="bg-zinc-800 border border-zinc-700 text-zinc-200 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-red-500">
                    <option value="王道・鉄板">王道・鉄板</option>
                    <option value="修羅場・ピンチ">修羅場・ピンチ</option>
                    <option value="恋愛・人間関係">恋愛・人間関係</option>
                    <option value="黒歴史・秘密">黒歴史・秘密</option>
                    <option value="カスタム">カスタム</option>
                </select>
                <input type="text" id="newThemeInput" placeholder="新しいトークテーマを入力..." class="flex-grow bg-zinc-800 border border-zinc-700 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-red-500">
                <button id="addThemeBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold text-sm px-4 py-2 rounded-lg transition whitespace-nowrap">
                    ＋ 追加
                </button>
            </div>

            <!-- テーマ一覧リスト -->
            <div id="themesListContainer" class="p-4 overflow-y-auto flex-grow space-y-2">
                <!-- JSで動的に生成 -->
            </div>

            <!-- モーダルフッター -->
            <div class="p-4 border-t border-zinc-800 flex justify-between items-center bg-zinc-900 rounded-b-2xl">
                <button id="restoreDefaultsBtn" class="text-xs text-zinc-400 hover:text-white underline">
                    初期テーマに戻す
                </button>
                <button id="doneThemesBtn" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold text-sm px-6 py-2 rounded-lg transition">
                    完了
                </button>
            </div>
        </div>
    </div>

    <!-- カスタム通知トースト（alertの代わり） -->
    <div id="toastMessage" class="fixed bottom-5 right-5 bg-zinc-800 border-l-4 border-red-500 text-white px-4 py-3 rounded-lg shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm font-medium">
        メッセージ
    </div>

    <script>
        /**
         * トークバトル・ルーレット アプリケーション
         */

        // デフォルトのトークテーマ集
        const DEFAULT_THEMES = [
            { id: 1, category: "修羅場・ピンチ", text: "人生で一番「終わった…」と絶望した瞬間" },
            { id: 2, category: "黒歴史・秘密", text: "今だから言える、人生最大の嘘" },
            { id: 3, category: "王道・鉄板", text: "今まで出会った中で一番ヤバかった人の話" },
            { id: 4, category: "恋愛・人間関係", text: "大恋愛の末に待ち受けていた衝撃の結末" },
            { id: 5, category: "修羅場・ピンチ", text: "九死に一生を得た！ギリギリ助かった話" },
            { id: 6, category: "黒歴史・秘密", text: "思い出すだけで夜も眠れないほど恥ずかしい記憶" },
            { id: 7, category: "王道・鉄板", text: "どうしても許せない！怒りが爆発したエピソード" },
            { id: 8, category: "恋愛・人間関係", text: "良かれと思ってやったのに大失敗したこと" },
            { id: 9, category: "修羅場・ピンチ", text: "お金にまつわる一番ヒヤッとした話" },
            { id: 10, category: "王道・鉄板", text: "実は私、こんな特殊な体験をしたことがあります" },
            { id: 11, category: "黒歴史・秘密", text: "誰にも言えずに墓場まで持っていこうとしていた秘密" },
            { id: 12, category: "恋愛・人間関係", text: "この人とは絶対に分かり合えないと確信した瞬間" },
            { id: 13, category: "修羅場・ピンチ", text: "旅先や出先で起きた信じられないトラブル" },
            { id: 14, category: "王道・鉄板", text: "人生観がガラッと変わった衝撃の一言・出来事" },
            { id: 15, category: "恋愛・人間関係", text: "今思えば完全に騙されていたな…という話" }
        ];

        // アプリの状態管理
        let state = {
            themes: [],
            usedIds: [],
            isSpinning: false,
            spinInterval: null,
            currentTheme: null,
            soundEnabled: true,
            timerSeconds: 60,
            timerRemaining: 60,
            timerRunning: false,
            timerInterval: null
        };

        // DOM要素の取得
        const els = {
            themeCategory: document.getElementById('themeCategory'),
            themeDisplay: document.getElementById('themeDisplay'),
            themeSubtext: document.getElementById('themeSubtext'),
            rouletteBox: document.getElementById('rouletteBox'),
            mainActionBtn: document.getElementById('mainActionBtn'),
            mainBtnText: document.getElementById('mainBtnText'),
            playIcon: document.getElementById('playIcon'),
            stopIcon: document.getElementById('stopIcon'),
            statusBadge: document.getElementById('statusBadge'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            excludeUsedCheckbox: document.getElementById('excludeUsedCheckbox'),
            remainingCount: document.getElementById('remainingCount'),
            themeCountBadge: document.getElementById('themeCountBadge'),
            historySection: document.getElementById('historySection'),
            historyList: document.getElementById('historyList'),
            resetHistoryBtn: document.getElementById('resetHistoryBtn'),
            // タイマー関連
            timerDisplay: document.getElementById('timerDisplay'),
            timerPreset: document.getElementById('timerPreset'),
            timerToggleBtn: document.getElementById('timerToggleBtn'),
            timerResetBtn: document.getElementById('timerResetBtn'),
            // サウンド関連
            soundToggleBtn: document.getElementById('soundToggleBtn'),
            soundOnIcon: document.getElementById('soundOnIcon'),
            soundOffIcon: document.getElementById('soundOffIcon'),
            soundStatusText: document.getElementById('soundStatusText'),
            // モーダル関連
            themesModal: document.getElementById('themesModal'),
            openThemesBtn: document.getElementById('openThemesBtn'),
            closeThemesBtn: document.getElementById('closeThemesBtn'),
            doneThemesBtn: document.getElementById('doneThemesBtn'),
            newThemeCategory: document.getElementById('newThemeCategory'),
            newThemeInput: document.getElementById('newThemeInput'),
            addThemeBtn: document.getElementById('addThemeBtn'),
            themesListContainer: document.getElementById('themesListContainer'),
            restoreDefaultsBtn: document.getElementById('restoreDefaultsBtn'),
            toastMessage: document.getElementById('toastMessage')
        };

        // Tone.js シンセサイザーの初期化（効果音用）
        let tickSynth, stopSynth, alarmSynth;
        function initAudio() {
            if (!tickSynth) {
                tickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 }
                }).toDestination();
                tickSynth.volume.value = -10;

                stopSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0.1, release: 0.8 }
                }).toDestination();
                stopSynth.volume.value = -6;

                alarmSynth = new Tone.Synth({
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.4 }
                }).toDestination();
                alarmSynth.volume.value = -8;
            }
        }

        function playTickSound() {
            if (!state.soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                initAudio();
                tickSynth.triggerAttackRelease("C4", "32n");
            } catch (e) { /* オーディオ未許可時は無視 */ }
        }

        function playStopSound() {
            if (!state.soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                initAudio();
                // ドラマチックなジャーン！という和音
                stopSynth.triggerAttackRelease(["C3", "G3", "C4", "E4", "G4"], "2n");
            } catch (e) {}
        }

        function playAlarmSound() {
            if (!state.soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                initAudio();
                const now = Tone.now();
                alarmSynth.triggerAttackRelease("A4", "16n", now);
                alarmSynth.triggerAttackRelease("A4", "16n", now + 0.15);
                alarmSynth.triggerAttackRelease("A5", "4n", now + 0.3);
            } catch (e) {}
        }

        // トースト通知表示
        let toastTimeout;
        function showToast(msg) {
            els.toastMessage.textContent = msg;
            els.toastMessage.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                els.toastMessage.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // ローカルストレージからの読み込み・保存
        function loadState() {
            try {
                const savedThemes = localStorage.getItem('talkBattle_themes');
                if (savedThemes) {
                    state.themes = JSON.parse(savedThemes);
                } else {
                    state.themes = [...DEFAULT_THEMES];
                }
            } catch (e) {
                state.themes = [...DEFAULT_THEMES];
            }
            updateCounts();
            renderThemesList();
        }

        function saveThemes() {
            try {
                localStorage.setItem('talkBattle_themes', JSON.stringify(state.themes));
            } catch (e) {}
            updateCounts();
        }

        // カウント表示の更新
        function updateCounts() {
            els.themeCountBadge.textContent = state.themes.length;
            const available = getAvailableThemes();
            els.remainingCount.textContent = available.length;
        }

        // 出題可能なテーマリストを取得
        function getAvailableThemes() {
            if (!els.excludeUsedCheckbox.checked) {
                return state.themes;
            }
            return state.themes.filter(t => !state.usedIds.includes(t.id));
        }

        // ルーレットのスタート・ストップ制御
        function toggleRoulette() {
            if (state.isSpinning) {
                stopRoulette();
            } else {
                startRoulette();
            }
        }

        function startRoulette() {
            const available = getAvailableThemes();
            if (state.themes.length === 0) {
                showToast("テーマが1つもありません。右上の「テーマ設定」から追加してください！");
                return;
            }
            if (available.length === 0) {
                showToast("すべてのテーマが出題されました！履歴をリセットします。");
                resetHistory();
                return;
            }

            // オーディオコンテキストの起動（ユーザー操作トリガー）
            if (state.soundEnabled && Tone.context.state !== 'running') {
                Tone.start();
            }

            state.isSpinning = true;
            
            // UIを回転中状態に更新
            els.mainBtnText.textContent = "ストップ！";
            els.playIcon.classList.add('hidden');
            els.stopIcon.classList.remove('hidden');
            els.mainActionBtn.classList.remove('from-red-500', 'to-red-700', 'hover:from-red-400', 'hover:to-red-600');
            els.mainActionBtn.classList.add('from-amber-500', 'to-amber-600', 'hover:from-amber-400', 'hover:to-amber-500', 'btn-stop');
            
            els.statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping";
            els.statusText.textContent = "SELECTING THEME...";
            els.statusText.className = "text-amber-400";
            els.themeSubtext.textContent = "タイミングを見計らってボタンを押せ！";

            // 高速でテーマを切り替えるインターバル
            let lastIndex = -1;
            state.spinInterval = setInterval(() => {
                let randomIndex;
                if (available.length > 1) {
                    do {
                        randomIndex = Math.floor(Math.random() * available.length);
                    } while (randomIndex === lastIndex);
                } else {
                    randomIndex = 0;
                }
                lastIndex = randomIndex;
                const candidate = available[randomIndex];
                
                els.themeCategory.textContent = candidate.category;
                els.themeDisplay.textContent = candidate.text;
                state.currentTheme = candidate;
                playTickSound();
            }, 65);
        }

        function stopRoulette() {
            if (!state.isSpinning) return;
            clearInterval(state.spinInterval);
            state.isSpinning = false;

            playStopSound();

            // UIを決定状態に更新
            els.mainBtnText.textContent = "次のテーマを回す";
            els.stopIcon.classList.add('hidden');
            els.playIcon.classList.remove('hidden');
            els.mainActionBtn.classList.remove('from-amber-500', 'to-amber-600', 'hover:from-amber-400', 'hover:to-amber-500', 'btn-stop');
            els.mainActionBtn.classList.add('from-red-500', 'to-red-700', 'hover:from-red-400', 'hover:to-red-600');

            els.statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            els.statusText.textContent = "THEME DECIDED! TALK START!";
            els.statusText.className = "text-red-500";
            els.themeSubtext.textContent = "さあ、このテーマでエピソードトークを披露せよ！";

            // フラッシュ演出
            els.rouletteBox.classList.remove('animate-flash');
            void els.rouletteBox.offsetWidth; // リフロー強制
            els.rouletteBox.classList.add('animate-flash');

            // 出題済みリストに追加
            if (state.currentTheme && !state.usedIds.includes(state.currentTheme.id)) {
                state.usedIds.push(state.currentTheme.id);
                updateHistoryUI();
            }
            updateCounts();

            // タイマーをリセットして準備
            resetTimer();
        }

        // 出題済み履歴のUI更新
        function updateHistoryUI() {
            if (state.usedIds.length === 0) {
                els.historySection.classList.add('hidden');
                return;
            }
            els.historySection.classList.remove('hidden');
            els.historyList.innerHTML = '';

            state.usedIds.forEach(id => {
                const theme = state.themes.find(t => t.id === id);
                if (theme) {
                    const badge = document.createElement('span');
                    badge.className = "text-xs bg-zinc-800/90 text-zinc-400 border border-zinc-700 px-2.5 py-1 rounded-md truncate max-w-[200px]";
                    badge.title = theme.text;
                    badge.textContent = `✓ ${theme.text}`;
                    els.historyList.appendChild(badge);
                }
            });
        }

        function resetHistory() {
            state.usedIds = [];
            updateHistoryUI();
            updateCounts();
            showToast("出題履歴をリセットしました");
        }

        // タイマー機能
        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerDisplay() {
            els.timerDisplay.textContent = formatTime(state.timerRemaining);
            if (state.timerRemaining <= 10 && state.timerRemaining > 0) {
                els.timerDisplay.classList.add('text-red-500');
                els.timerDisplay.classList.remove('text-white');
            } else if (state.timerRemaining === 0) {
                els.timerDisplay.classList.add('text-red-600');
            } else {
                els.timerDisplay.classList.remove('text-red-500', 'text-red-600');
                els.timerDisplay.classList.add('text-white');
            }
        }

        function toggleTimer() {
            if (state.timerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (state.timerRemaining <= 0) {
                state.timerRemaining = parseInt(els.timerPreset.value, 10);
            }
            state.timerRunning = true;
            els.timerToggleBtn.textContent = "一時停止";
            els.timerToggleBtn.classList.replace('bg-zinc-700', 'bg-red-600');
            els.timerToggleBtn.classList.replace('hover:bg-zinc-600', 'hover:bg-red-500');

            state.timerInterval = setInterval(() => {
                state.timerRemaining--;
                updateTimerDisplay();

                if (state.timerRemaining <= 0) {
                    pauseTimer();
                    playAlarmSound();
                    showToast("⏰ トークタイム終了！判定はどうだ！？");
                }
            }, 1000);
        }

        function pauseTimer() {
            state.timerRunning = false;
            clearInterval(state.timerInterval);
            els.timerToggleBtn.textContent = "スタート";
            els.timerToggleBtn.classList.replace('bg-red-600', 'bg-zinc-700');
            els.timerToggleBtn.classList.replace('hover:bg-red-500', 'hover:bg-zinc-600');
        }

        function resetTimer() {
            pauseTimer();
            state.timerRemaining = parseInt(els.timerPreset.value, 10);
            updateTimerDisplay();
        }

        // テーマ管理モーダル関連
        function renderThemesList() {
            els.themesListContainer.innerHTML = '';
            if (state.themes.length === 0) {
                els.themesListContainer.innerHTML = '<p class="text-center text-zinc-500 py-8 text-sm">テーマが登録されていません。上のフォームから追加してください。</p>';
                return;
            }

            state.themes.forEach(theme => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between gap-3 bg-zinc-800/60 border border-zinc-700/70 p-3 rounded-xl hover:border-zinc-600 transition";
                
                const left = document.createElement('div');
                left.className = "flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 overflow-hidden";
                
                const catBadge = document.createElement('span');
                catBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded bg-red-950/80 text-red-400 border border-red-800/50 w-fit whitespace-nowrap";
                catBadge.textContent = theme.category;

                const textSpan = document.createElement('span');
                textSpan.className = "text-sm text-zinc-100 truncate";
                textSpan.textContent = theme.text;

                left.appendChild(catBadge);
                left.appendChild(textSpan);

                const delBtn = document.createElement('button');
                delBtn.className = "text-zinc-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-zinc-700/50 transition flex-shrink-0";
                delBtn.title = "削除";
                delBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                delBtn.onclick = () => deleteTheme(theme.id);

                item.appendChild(left);
                item.appendChild(delBtn);
                els.themesListContainer.appendChild(item);
            });
        }

        function addTheme() {
            const text = els.newThemeInput.value.trim();
            const category = els.newThemeCategory.value;
            if (!text) {
                showToast("テーマの内容を入力してください");
                return;
            }
            const newId = state.themes.length > 0 ? Math.max(...state.themes.map(t => t.id)) + 1 : 1;
            state.themes.unshift({ id: newId, category, text });
            els.newThemeInput.value = '';
            saveThemes();
            renderThemesList();
            showToast("新しいテーマを追加しました！");
        }

        function deleteTheme(id) {
            state.themes = state.themes.filter(t => t.id !== id);
            state.usedIds = state.usedIds.filter(usedId => usedId !== id);
            saveThemes();
            renderThemesList();
            updateHistoryUI();
        }

        function restoreDefaultThemes() {
            state.themes = [...DEFAULT_THEMES];
            state.usedIds = [];
            saveThemes();
            renderThemesList();
            updateHistoryUI();
            showToast("初期テーマリストに戻しました");
        }

        // イベントリスナーの登録
        els.mainActionBtn.addEventListener('click', toggleRoulette);

        // スペースキーでもスタート・ストップできるようにする（モーダルが開いていない時）
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && els.themesModal.classList.contains('hidden') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                e.preventDefault();
                toggleRoulette();
            }
        });

        els.excludeUsedCheckbox.addEventListener('change', updateCounts);
        els.resetHistoryBtn.addEventListener('click', resetHistory);

        // タイマーイベント
        els.timerPreset.addEventListener('change', resetTimer);
        els.timerToggleBtn.addEventListener('click', toggleTimer);
        els.timerResetBtn.addEventListener('click', resetTimer);

        // サウンド切り替え
        els.soundToggleBtn.addEventListener('click', () => {
            state.soundEnabled = !state.soundEnabled;
            if (state.soundEnabled) {
                els.soundOnIcon.classList.remove('hidden');
                els.soundOffIcon.classList.add('hidden');
                els.soundStatusText.textContent = "SE: ON";
                showToast("効果音をONにしました");
            } else {
                els.soundOnIcon.classList.add('hidden');
                els.soundOffIcon.classList.remove('hidden');
                els.soundStatusText.textContent = "SE: OFF";
                showToast("効果音をOFFにしました");
            }
        });

        // モーダル開閉・操作
        els.openThemesBtn.addEventListener('click', () => {
            if (state.isSpinning) stopRoulette();
            renderThemesList();
            els.themesModal.classList.remove('hidden');
        });
        const closeModal = () => els.themesModal.classList.add('hidden');
        els.closeThemesBtn.addEventListener('click', closeModal);
        els.doneThemesBtn.addEventListener('click', closeModal);
        els.themesModal.addEventListener('click', (e) => {
            if (e.target === els.themesModal) closeModal();
        });

        els.addThemeBtn.addEventListener('click', addTheme);
        els.newThemeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTheme();
        });
        els.restoreDefaultsBtn.addEventListener('click', restoreDefaultThemes);

        // 初期化実行
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            updateTimerDisplay();
        });
    </script>
</body>
</html>
