<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズ！100人に聞きました風パネル</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel CDN (JSXをブラウザで実行するため) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-x-180 { transform: rotateX(180deg); }
        .overflow-y-auto::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        /* ポップなフォントスタイル（Google Fonts）を追加 */
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            // 問題データセット
            const quizData = [
                {
                    id: 1,
                    question: "20代が使ったことがある「だじゃれ」は？",
                    answers: [
                        { text: "やばたにえん", points: 20 },
                        { text: "トイレに行っトイレ", points: 15 },
                        { text: "あざ丸水産", points: 14 },
                        { text: "電話に出んわ", points: 13 },
                        { text: "うれシーサー", points: 11 },
                        { text: "了解道中膝栗毛", points: 10 },
                        { text: "ヤバ杉謙信", points: 8 },
                        { text: "そうしよう類単子葉類", points: 5 },
                        { text: "大量のタイ料理", points: 4 },
                    ]
                },
                {
                    id: 2,
                    question: "カラオケで１曲目に歌われがちな曲は？",
                    answers: [
                        { text: "残酷な天使のテーゼ（高橋洋子）", points: 25 },
                        { text: "怪獣の花唄（Vaundy）", points: 20 },
                        { text: "夏色（ゆず）", points: 15 },
                        { text: "女々しくて（ゴールデンボンバー）", points: 13 },
                        { text: "リンダリンダ（THE BLUE HEARTS）", points: 10 },
                        { text: "アイドル（YOASOBI）", points: 8 },
                        { text: "Bling-Bang-Bang-Born（Creepy Nuts）", points: 6 },
                        { text: "ultra soul（B'z）", points: 3 },

                    ]
                },
                {
                    id: 3,
                    question: "たいぞーが恋した有名人は？",
                    answers: [
                        { text: "松嶋菜々子", points: 28 },
                        { text: "南野陽子", points: 25 },
                        { text: "新垣結衣", points: 18 },
                        { text: "綾瀬はるか", points: 10 },
                        { text: "渋谷凪咲", points: 7 },
                        { text: "木村文乃", points: 6 },
                        { text: "岩谷麻優", points: 4 },
                        { text: "アイナ・ジ・エンド", points: 2 },
                    ]
                }
            ];

            const [selectedQuestionIdx, setSelectedQuestionIdx] = useState(0);
            const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
            const [flipped, setFlipped] = useState(new Array(9).fill(false));

            const currentQuestion = quizData[activeQuestionIdx];

            const handleConfirm = () => {
                setActiveQuestionIdx(selectedQuestionIdx);
                setFlipped(new Array(9).fill(false));
            };

            const togglePanel = (index) => {
                if (!currentQuestion.answers[index]) return;
                const newFlipped = [...flipped];
                newFlipped[index] = !newFlipped[index];
                setFlipped(newFlipped);
            };

            const resetCurrentPanels = () => {
                setFlipped(new Array(9).fill(false));
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-yellow-100 via-pink-100 to-cyan-100 flex flex-col items-center justify-start p-4 md:p-8 text-slate-800">
                    {/* 選択エリア */}
                    <div className="w-full max-w-2xl bg-white/80 backdrop-blur-sm p-6 rounded-3xl mb-8 border-4 border-white shadow-xl">
                        <div className="flex flex-col md:flex-row gap-4 items-end">
                            <div className="flex-grow w-full">
                                <label className="block text-sm font-bold text-pink-500 mb-2">🎈 問題を選んで！</label>
                                <select
                                    value={selectedQuestionIdx}
                                    onChange={(e) => setSelectedQuestionIdx(parseInt(e.target.value))}
                                    className="w-full bg-pink-50 border-4 border-pink-200 rounded-2xl px-4 py-3 text-slate-700 font-bold focus:outline-none focus:border-pink-400 transition-colors"
                                >
                                    {quizData.map((q, idx) => (
                                        <option key={q.id} value={idx}>
                                            Q{q.id}: {q.question}
                                        </option>
                                    ))}
                                </select>
                            </div>
                            <button
                                onClick={handleConfirm}
                                className="w-full md:w-auto bg-pink-500 hover:bg-pink-400 text-white font-black py-3 px-8 rounded-2xl transition-all shadow-[0_6px_0_rgb(219,39,119)] active:shadow-none active:translate-y-[6px] whitespace-nowrap border-2 border-white"
                            >
                                問題チェンジ！
                            </button>
                        </div>
                    </div>

                    <div className="mb-10 bg-white border-4 border-pink-400 rounded-xl md:rounded-2xl px-6 md:px-12 py-4 md:py-6 shadow-[0_6px_0_rgb(244,114,182)] relative w-full max-w-4xl mx-auto">
                        <div className="absolute -top-4 -left-2 text-4xl animate-bounce">✨</div>
                        <div className="absolute -bottom-4 -right-2 text-4xl animate-bounce" style={{ animationDelay: '0.5s' }}>✨</div>
                        <h1 className="text-2xl md:text-4xl font-black text-slate-800 tracking-widest text-center leading-tight">
                            {currentQuestion.question}
                        </h1>
                    </div>

                    {/* パネルグリッド */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
                        {[...Array(9)].map((_, index) => {
                            const answer = currentQuestion.answers[index];
                            const hasAnswer = !!answer;

                            return (
                                <div
                                    key={index}
                                    onClick={() => togglePanel(index)}
                                    className={`group h-32 md:h-40 perspective-1000 ${hasAnswer ? 'cursor-pointer hover:scale-105 transition-transform' : 'cursor-not-allowed opacity-60'}`}
                                >
                                    <div
                                        className={`relative w-full h-full transition-transform duration-500 transform-style-3d ${
                                            flipped[index] ? 'rotate-x-180' : ''
                                        }`}
                                    >
                                        {/* 表面 (数字) */}
                                        <div className={`absolute inset-0 backface-hidden border-4 rounded-3xl flex items-center justify-center shadow-lg ${
                                            hasAnswer 
                                                ? 'bg-gradient-to-b from-cyan-300 to-blue-400 border-white' 
                                                : 'bg-gray-200 border-white'
                                        }`}>
                                            <span className={`text-7xl font-black drop-shadow-md ${hasAnswer ? 'text-white' : 'text-gray-400'}`}>
                                                {index + 1}
                                            </span>
                                        </div>

                                        {/* 裏面 (回答) */}
                                        {hasAnswer && (
                                            <div className="absolute inset-0 backface-hidden bg-gradient-to-b from-yellow-200 to-yellow-400 border-4 border-white rounded-3xl flex items-center px-5 rotate-x-180 shadow-inner overflow-hidden">
                                                <div className="flex-grow flex items-center h-full pr-2">
                                                    <span className="text-lg md:text-xl font-black leading-tight break-words overflow-y-auto max-h-full py-1 text-slate-800">
                                                        {answer.text}
                                                    </span>
                                                </div>
                                                <div className="flex-shrink-0 flex items-center justify-center h-full border-l-4 border-white border-dashed pl-4 ml-auto">
                                                    <span className="text-4xl md:text-5xl font-black text-pink-500 drop-shadow-sm">
                                                        {answer.points}
                                                    </span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-14 flex gap-4">
                        <button
                            onClick={resetCurrentPanels}
                            className="bg-cyan-500 hover:bg-cyan-400 text-white font-black py-4 px-12 rounded-full transition-all shadow-[0_6px_0_rgb(6,182,212)] active:shadow-none active:translate-y-[6px] border-4 border-white text-xl"
                        >
                            パネルを全部閉じる
                        </button>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
